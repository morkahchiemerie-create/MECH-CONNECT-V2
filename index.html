<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mechconnect Login Portal</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background: #0b1f3a;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        background: #ffffff10; 
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 15px;
        width: 100%;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h2 {
        margin-bottom: 25px;
        font-size: 1.3rem;
    }

    .btn {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .blue { background: #1b3f88; color: white; }
    .blue:hover { background: #2552b5; }

    .silver { background: #c0c0c0; color: #0b1f3a; }
    .silver:hover { background: #e2e2e2; }

    .login-section, .signin-section {
        margin-top: 20px;
        display: none;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 6px;
        background: #ffffffd9;
        color: #000;
    }

    .login-btn {
        background: #1b3f88;
        color: white;
        padding: 12px;
        border-radius: 8px;
        border: none;
        width: 100%;
        margin-top: 10px;
        cursor: pointer;
    }

    .login-btn:hover { background: #2552b5; }

    .sign-in {
        color: rgb(236, 30, 40);
        cursor: pointer;
        margin-top: 10px;
        display: block;
    }

</style>
</head>

<body>

<div class="container">

    <h2>Welcome to Mech-connect Login Portal</h2>

    <!-- USER TYPE -->
    <div class="user-group">
        <button class="btn blue" onclick="goProspective()">Prospective Student</button>
        <button class="btn silver" onclick="showLogin('current')">Current Student</button>
        <button class="btn silver" onclick="showLogin('lecturer')">Lecturer</button>
    </div>

    <!-- LOGIN -->
    <div id="loginBox" class="login-section">
        <h3 id="loginTitle"></h3>

        <input type="text" id="loginUser" placeholder="">
        <input type="password" id="loginPassword" placeholder="Password">

        <button class="login-btn" onclick="loginUser()">Login</button>
        <span class="sign-in" onclick="studentForm()">Create account</span>
        <span class="sign-in" onclick="goBack()">Back</span>
    </div>

    <!-- SIGN UP -->
    <div class="signin-section" id="signupBox">
        <h3>Create Student Account</h3>

        <input type="text" id="full_name" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="matric_or_staff_id" placeholder="Matric Number">
        <input type="text" id="level" placeholder="Level">
        <input type="text" id="residence" placeholder="Residence">
        <input type="password" id="password" placeholder="Password">
        <input type="password" id="confirm_password" placeholder="Confirm Password">

        <button class="login-btn" onclick="registerUser()">Register</button>
        <span class="sign-in" onclick="goBack()">Back</span>
    </div>

</div>

<script>

const BASE_URL = "http://127.0.0.1:5000/api/auth";

// ================= UI =================
function goProspective() {
    window.location.href = "frontend/public/dashboard.html";
}

function showLogin(type) {
    document.querySelector(".user-group").style.display = "none";
    document.getElementById("loginBox").style.display = "block";

    let title = document.getElementById("loginTitle");
    let userField = document.getElementById("loginUser");

    if (type === "current") {
        title.innerHTML = "Current Student Login";
        userField.placeholder = "Email or Matric Number";
    } else {
        title.innerHTML = "Lecturer Login";
        userField.placeholder = "Email or Staff ID";
    }
}

function studentForm(){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("signupBox").style.display = "block";
}

function goBack(){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("signupBox").style.display = "none";
    document.querySelector(".user-group").style.display = "block";
}

// ================= REGISTER =================
async function registerUser() {

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm_password").value;

    if (password !== confirm) {
        alert("Passwords do not match");
        return;
    }

    const data = {
        full_name: document.getElementById("full_name").value,
        email: document.getElementById("email").value,
        matric_or_staff_id: document.getElementById("matric_or_staff_id").value,
        level: document.getElementById("level").value,
        residence: document.getElementById("residence").value,
        password: password,
        role: "student"
    };

    const res = await fetch(`${BASE_URL}/register`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await res.json();

    if (res.ok) {
        alert("Registration successful");
        goBack();
    } else {
        alert(result.message || "Error occurred");
    }
}

async function loginUser() {

    const identifier = document.getElementById("loginUser").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!identifier || !password) {
        alert("Please fill in all fields.");
        return;
    }

    try {

        const res = await fetch(`${BASE_URL}/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                identifier,
                password
            })
        });

        const result = await res.json();

        if (!res.ok) {
            alert(result.message);
            return;
        }

        // =========================
        // SAVE LOGIN
        // =========================

        localStorage.setItem("access_token", result.access_token);
        localStorage.setItem("user", JSON.stringify(result.user));

        // =========================
        // CLEAR LOGIN FORM
        // =========================

        document.getElementById("loginUser").value = "";
        document.getElementById("loginPassword").value = "";

        // =========================
        // REDIRECT
        // =========================

        if (result.user.role === "student") {

            window.location.href = "frontend/student/dashboard.html";

        } else if (result.user.role === "lecturer") {

            window.location.href = "frontend/lecturer/dashboard.html";

        } else {

            alert("Unknown user role.");

        }

    } catch (error) {

        console.error(error);
        alert("Server error.");

    }

}

</script>

</body>
</html>
