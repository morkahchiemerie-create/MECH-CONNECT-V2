
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* Custom styles and animations */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .dark body {
            background: #0a0e17;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Smooth transitions */
        .transition-all {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Card hover effects */
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }
        .dark .card-hover:hover {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }
        
        /* Sidebar active state */
        .nav-item-active {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .dark .nav-item-active {
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.5);
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Notification badge pulse */
        .badge-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* Loading shimmer */
        .shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        /* Dark mode overrides */
        .dark .bg-white { background: #1a1f2e; }
        .dark .bg-gray-50 { background: #0d1117; }
        .dark .bg-gray-100 { background: #161b22; }
        .dark .text-gray-600 { color: #9ca3af; }
        .dark .text-gray-700 { color: #d1d5db; }
        .dark .text-gray-800 { color: #e5e7eb; }
        .dark .text-gray-900 { color: #f3f4f6; }
        .dark .border-gray-200 { border-color: #2d3748; }
        .dark .border-gray-300 { border-color: #374151; }
        .dark .hover\:bg-gray-50:hover { background: #1f2937; }
        .dark .hover\:bg-gray-100:hover { background: #2d3748; }
        
        /* Mobile menu overlay */
        .sidebar-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        
        /* Custom scroll for sidebar */
        .sidebar-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
        
        /* Resource card image placeholder */
        .resource-icon {
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
        }
        .dark .resource-icon {
            background: linear-gradient(135deg, #1e293b, #2d1b69);
        }
        
        /* Progress bar animation */
        .progress-bar {
            transition: width 1s ease-in-out;
        }
        
        /* Tooltip */
        .tooltip {
            position: relative;
        }
        .tooltip:hover::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 50;
        }
        
        /* Calendar grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .calendar-day:hover {
            background: #e5e7eb;
        }
        .dark .calendar-day:hover {
            background: #374151;
        }
        .calendar-day.today {
            background: #2563eb;
            color: white;
        }
        .calendar-day.has-event {
            position: relative;
        }
        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
        }
    </style>
</head>

        };

        // ============================================================
        // CONTEXT
        // ============================================================

        const AppContext = createContext(null);

        const AppProvider = ({ children }) => {
            const [darkMode, setDarkMode] = useState(() => {
                return localStorage.getItem('darkMode') === 'true' || 
                       window.matchMedia('(prefers-color-scheme: dark)').matches;
            });
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [notifications, setNotifications] = useState(MOCK_DATA.notifications);
            const [user, setUser] = useState(CURRENT_USER);

            useEffect(() => {
                localStorage.setItem('darkMode', darkMode);
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const markNotificationRead = (id) => {
                setNotifications(prev => 
                    prev.map(n => n.id === id ? { ...n, read: true } : n)
                );
            };

            const markAllNotificationsRead = () => {
                setNotifications(prev => prev.map(n => ({ ...n, read: true })));
            };

            const unreadCount = notifications.filter(n => !n.read).length;

            const value = {
                darkMode,
                setDarkMode,
                currentPage,
                setCurrentPage,
                sidebarOpen,
                setSidebarOpen,
                user,
                notifications,
                markNotificationRead,
                markAllNotificationsRead,
                unreadCount,
                data: MOCK_DATA
            };

            return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
        };

        const useApp = () => {
            const context = useContext(AppContext);
            if (!context) {
                throw new Error('useApp must be used within AppProvider');
            }
            return context;
        };

        // ============================================================
        // ICON COMPONENTS
        // ============================================================

        const Icons = {

            ChevronRight: () => <i className="fas fa-chevron-right"></i>,

            External: () => <i className="fas fa-external-link-alt"></i>,

        // COMPONENTS
        // ============================================================

                            {/* Notifications */}

                                <button

                                    className="relative p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-all"

                                    {unreadCount > 0 && (
                                        <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center badge-pulse">
                                            {unreadCount}
                                        </span>
                                    )}
                                </button>

                                {/* Notification Dropdown */}
                                {showNotifications && (
                                    <div className="absolute right-0 mt-2 w-96 bg-white dark:bg-[#1a1f2e] rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-800 overflow-hidden z-50">
                                        <div className="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-800">
                                            <h3 className="font-semibold">Notifications</h3>

                                <div key={mentor.id} className="bg-white dark:bg-[#1a1f2e] rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-gray-800 card-hover text-center">
                                    <div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-blue-100 to-purple-100 dark:from-blue-950/30 dark:to-purple-950/30 flex items-center justify-center text-3xl font-bold text-blue-600 dark:text-blue-400">
                                        {mentor.name.split(' ').map(n => n[0]).join('')}
                                    </div>
                                    <h3 className="mt-3 font-bold text-gray-900 dark:text-white">{mentor.name}</h3>
                                    <p className="text-sm text-gray-500 dark:text-gray-400">{mentor.specialization}</p>
                                    <div className={`mt-2 text-sm ${mentor.available ? 'text-green-600 dark:text-green-400' : 'text-gray-400 dark:text-gray-500'}`}>
                                        <i className={`fas ${mentor.available ? 'fa-circle' : 'fa-circle'}`}></i>
                                        {mentor.available ? ' Available' : ' Unavailable'}
                                    </div>
                                    <button className={`mt-3 w-full px-4 py-2 rounded-lg text-sm transition-all ${mentor.available ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-400 cursor-not-allowed'}`}>
                                        {mentor.available ? 'Request Mentorship' : 'Not Available'}
                                    </button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ---- Organization Page ----
        const OrganizationPage = () => {
            const { data } = useApp();
            const [view, setView] = useState('timetable');
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

            // Generate calendar days for current month
            const generateCalendar = () => {
                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = [];
                for (let i = 0; i < firstDay; i++) {
                    days.push(null);
                }
                for (let i = 1; i <= daysInMonth; i++) {
                    days.push(i);
                }
                return days;
            };

            const calendarDays = generateCalendar();
            const today = new Date().getDate();

            return (
                <div className="p-4 md:p-6 space-y-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-900 dark:text-white">Organization</h1>
                            <p className="text-gray-500 dark:text-gray-400">Manage your timetable, tasks, and academic calendar</p>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => setView('timetable')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${view === 'timetable' ? 'bg-blue-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400'}`}
                            >
                                Timetable
                            </button>
                            <button 
                                onClick={() => setView('calendar')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${view === 'calendar' ? 'bg-blue-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400'}`}
                            >
                                Calendar
                            </button>
                        </div>
                    </div>

                    {view === 'timetable' ? (
                        <div className="bg-white dark:bg-[#1a1f2e] rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-gray-800 overflow-x-auto">
                            <div className="min-w-[600px]">
                                <div className="grid grid-cols-5 gap-2 mb-3">
                                    {days.map(day => (
                                        <div key={day} className="text-center font-bold text-gray-700 dark:text-gray-300 py-2 bg-gray-50 dark:bg-gray-800/50 rounded-xl">
                                            {day}
                                        </div>
                                    ))}
                                </div>
                                <div className="grid grid-cols-5 gap-2">
                                    {days.map((day, idx) => {
                                        const dayData = data.timetable.find(t => t.day === day);
                                        return (
                                            <div key={idx} className="min-h-[200px] p-2 bg-gray-50 dark:bg-gray-800/30 rounded-xl">
                                                {dayData && dayData.courses.map((course, cIdx) => (
                                                    <div key={cIdx} className="mb-2 p-2 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
                                                        <p className="text-xs font-medium text-gray-800 dark:text-gray-200">{course.course}</p>
                                                        <p className="text-xs text-gray-500 dark:text-gray-400">{course.time}</p>
                                                        <p className="text-xs text-gray-400 dark:text-gray-500">{course.venue}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-white dark:bg-[#1a1f2e] rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-gray-800">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="font-bold text-gray-900 dark:text-white">
                                    {new Date().toLocaleString('default', { month: 'long', year: 'numeric' })}
                                </h3>
                                <div className="flex gap-2">
                                    <button className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-all">
                                        <i className="fas fa-chevron-left"></i>
                                    </button>
                                    <button className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-all">
                                        <i className="fas fa-chevron-right"></i>
                                    </button>
                                </div>
                            </div>
                            <div className="calendar-grid">
                                {['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(d => (
                                    <div key={d} className="text-center text-sm font-medium text-gray-500 dark:text-gray-400 py-2">
                                        {d}
                                    </div>
                                ))}
                                {calendarDays.map((day, idx) => (
                                    <div 
                                        key={idx} 
                                        className={`calendar-day ${day === today ? 'today' : ''} ${day !== null && day % 5 === 0 ? 'has-event' : ''}`}
                                    >
                                        {day || ''}
                                    </div>
                                ))}
                            </div>
                            <div className="mt-4 p-3 bg-gray-50 dark:bg-gray-800/50 rounded-xl">
                                <h4 className="font-medium text-sm text-gray-700 dark:text-gray-300">Today's Tasks</h4>
                                <div className="mt-2 space-y-1">
                                    <div className="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
                                        <input type="checkbox" className="rounded" />
                                        <span>Review Thermodynamics notes</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
                                        <input type="checkbox" className="rounded" />
                                        <span>Complete Fluid Mechanics lab report</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
                                        <input type="checkbox" className="rounded" />
                                        <span>Prepare for Machine Design quiz</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ---- Services Page ----
        const ServicesPage = () => {
            const services = [
                { id: 1, name: 'Department Dues', icon: 'fa-money-bill-wave', color: 'green', description: 'View and pay your departmental dues' },
                { id: 2, name: 'Transcript Request', icon: 'fa-file-alt', color: 'blue', description: 'Request your academic transcript' },
                { id: 3, name: 'Clearance Information', icon: 'fa-check-circle', color: 'purple', description: 'View clearance requirements and status' },
                { id: 4, name: 'Department Forms', icon: 'fa-forms', color: 'orange', description: 'Access and submit departmental forms' },
                { id: 5, name: 'Registration Info', icon: 'fa-clipboard-list', color: 'red', description: 'Course registration guidelines and deadlines' },
                { id: 6, name: 'Department Documents', icon: 'fa-folder-open', color: 'indigo', description: 'Important departmental documents and policies' }
            ];

            return (
                <div className="p-4 md:p-6 space-y-6">
                    <div>
                        <h1 className="text-2xl font-bold text-gray-900 dark:text-white">Department Services</h1>
                        <p className="text-gray-500 dark:text-gray-400">Access all departmental services and information</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {services.map(service => (
                            <div key={service.id} className="bg-white dark:bg-[#1a1f2e] rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-gray-800 card-hover">
                                <div className={`w-12 h-12 rounded-xl bg-${service.color}-100 dark:bg-${service.color}-900/20 flex items-center justify-center text-${service.color}-600 dark:text-${service.color}-400 text-xl`}>
                                    <i className={`fas ${service.icon}`}></i>
                                </div>
                                <h3 className="mt-3 font-bold text-gray-900 dark:text-white">{service.name}</h3>
                                <p className="text-sm text-gray-500 dark:text-gray-400">{service.description}</p>
                                <button className="mt-3 text-sm text-blue-600 dark:text-blue-400 hover:underline font-medium">
                                    Access →
                                </button>
                            </div>
                        ))}
                    </div>

                    {/* Department Announcements */}
                    <div className="bg-white dark:bg-[#1a1f2e] rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-gray-800">
                        <h2 className="text-lg font-bold text-gray-900 dark:text-white mb-4 flex items-center gap-2">
                            <i className="fas fa-bullhorn text-blue-500"></i>
                            Department Announcements
                        </h2>
                        <div className="space-y-3">
                            {MOCK_DATA.announcements.map(ann => (
                                <div key={ann.id} className="p-3 bg-gray-50 dark:bg-gray-800/50 rounded-xl border-l-4 border-blue-500">
                                    <p className="font-medium text-gray-900 dark:text-white">{ann.title}</p>
                                    <p className="text-sm text-gray-600 dark:text-gray-400 mt-1">{ann.content}</p>
                                    <div className="flex items-center gap-4 mt-2 text-xs text-gray-400 dark:text-gray-500">
                                        <span><i className="fas fa-user mr-1"></i> {ann.postedBy}</span>
                                        <span><i className="fas fa-calendar-alt mr-1"></i> {ann.date}</span>
                                        <span className={`px-2 py-0.5 rounded-full ${
                                            ann.priority === 'high' ? 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400' :
                                            ann.priority === 'medium' ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400' :
                                            'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400'
                                        }`}>
                                            {ann.priority}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // ---- Toolkit Page ----
        const ToolkitPage = () => {
            const tools = [
                { id: 1, name: 'CGPA Calculator', icon: 'fa-calculator', color: 'blue', description: 'Calculate your GPA and CGPA' },
                { id: 2, name: 'Engineering Calculator', icon: 'fa-calculator', color: 'green', description: 'Scientific and engineering calculations' },
                { id: 3, name: 'Unit Converter', icon: 'fa-exchange-alt', color: 'purple', description: 'Convert between different units' },
                { id: 4, name: 'Material Properties', icon: 'fa-cubes', color: 'orange', description: 'Engineering material properties reference' },
                { id: 5, name: 'Steam Tables', icon: 'fa-thermometer-half', color: 'red', description: 'Thermodynamic steam properties' },
                { id: 6, name: 'Formula Sheets', icon: 'fa-scroll', color: 'indigo', description: 'Quick reference for engineering formulas' }
            ];

            return (
                <div className="p-4 md:p-6 space-y-6">
                    <div>
                        <h1 className="text-2xl font-bold text-gray-900 dark:text-white">Engineering Toolkit</h1>
                        <p className="text-gray-500 dark:text-gray-400">Essential tools for your engineering journey</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {tools.map(tool => (
                            <div key={tool.id} className="bg-white dark:bg-[#1a1f2e] rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-gray-800 card-hover">
                                <div className={`w-12 h-12 rounded-xl bg-${tool.color}-100 dark:bg-${tool.color}-900/20 flex items-center justify-center text-${tool.color}-600 dark:text-${tool.color}-400 text-xl`}>
                                    <i className={`fas ${tool.icon}`}></i>
                                </div>
                                <h3 className="mt-3 font-bold text-gray-900 dark:text-white">{tool.name}</h3>
                                <p className="text-sm text-gray-500 dark:text-gray-400">{tool.description}</p>
                                <button className="mt-3 px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition-all">
                                    Open Tool
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ---- Marketplace Page (Placeholder) ----
        const MarketplacePage = () => {
            return (
                <div className="p-4 md:p-6">
                    <div className="bg-white dark:bg-[#1a1f2e] rounded-2xl p-8 shadow-sm border border-gray-200 dark:border-gray-800 text-center">
                        <div className="w-20 h-20 mx-auto rounded-full bg-blue-50 dark:bg-blue-950/20 flex items-center justify-center text-blue-600 dark:text-blue-400 text-4xl">
                            <i className="fas fa-store"></i>
                        </div>
                        <h2 className="mt-4 text-2xl font-bold text-gray-900 dark:text-white">Marketplace</h2>
                        <p className="mt-2 text-gray-500 dark:text-gray-400 max-w-md mx-auto">
                            Buy and sell engineering books, tools, and project materials.
                            <br />
                            <span className="text-sm text-blue-600 dark:text-blue-400">Coming Soon!</span>
                        </p>
                        <div className="mt-6 flex justify-center gap-4">
                            <div className="px-4 py-2 bg-gray-100 dark:bg-gray-800 rounded-lg">
                                <p className="text-sm text-gray-500 dark:text-gray-400">Books</p>
                            </div>
                            <div className="px-4 py-2 bg-gray-100 dark:bg-gray-800 rounded-lg">
                                <p className="text-sm text-gray-500 dark:text-gray-400">Tools</p>
                            </div>
                            <div className="px-4 py-2 bg-gray-100 dark:bg-gray-800 rounded-lg">
                                <p className="text-sm text-gray-500 dark:text-gray-400">Lab Equipment</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // MAIN APP
        // ============================================================

        const App = () => {
            const { currentPage } = useApp();

            const renderPage = () => {
                switch(currentPage) {
                    case 'dashboard': return <DashboardPage />;
                    case 'learning': return <LearningPage />;
                    case 'collaboration': return <CollaborationPage />;
                    case 'organization': return <OrganizationPage />;
                    case 'services': return <ServicesPage />;
                    case 'toolkit': return <ToolkitPage />;
                    case 'marketplace': return <MarketplacePage />;
                    default: return <DashboardPage />;
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-[#0a0e17] text-gray-900 dark:text-white flex">
                    <Sidebar />
                    <div className="flex-1 flex flex-col min-h-screen overflow-x-hidden">
                        <TopBar />
                        <main className="flex-1">
                            {renderPage()}
                        </main>
                        {/* Footer */}
                        <footer className="border-t border-gray-200 dark:border-gray-800 px-4 py-4 text-center text-sm text-gray-500 dark:text-gray-400">
                            <div className="flex flex-wrap items-center justify-center gap-4">
                                <span>© 2026 MECHCONNECT. All rights reserved.</span>
                                <span>|</span>
                                <a href="#" className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">About</a>
                                <a href="#" className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Contact</a>
                                <a href="#" className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Support</a>
                                <a href="#" className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Privacy</a>
                                <a href="#" className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Terms</a>
                                <div className="flex items-center gap-2">
                                    <a href="#" className="text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                                        <i className="fab fa-github"></i>
                                    </a>
                                    <a href="#" className="text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                                        <i className="fab fa-twitter"></i>
                                    </a>
                                    <a href="#" className="text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                                        <i className="fab fa-linkedin"></i>
                                    </a>
                                </div>
                            </div>
                        </footer>
                    </div>
                </div>
            );
        };

        // ============================================================
        // RENDER
        // ============================================================

        const Root = () => {
            return (
                <AppProvider>
                    <App />
                </AppProvider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>
</html>
